dataset_mode: "workspace_coverage"
dry_run: false
sample_count_target: 4092
continue_until_valid_samples: True
target_valid_sample_count:
samples_per_command: 1
# --- Multi-frame post-settle tracker averaging ------------------------------
# When tracker_samples_per_command > 1, after the single settle_time_s the
# experiment collects N deduplicated tracker frames (per `last_frame_number`)
# and emits two label variants per command:
#   - samples_first.jsonl: matches today's first-valid-post-settle behaviour
#   - samples_averaged.jsonl: position averaged + sign-aligned quaternion mean
# raw_tracker_samples.jsonl preserves every per-frame snapshot for audit.
# Mutually exclusive with samples_per_command > 1.
# Skeptical framing: this estimates random frame-to-frame noise; it does NOT
# remove systematic registration bias, hysteresis, or settling drift.
tracker_samples_per_command: 1
tracker_per_frame_max_wait_s: 1.0
tracker_sample_period_s:        # null → reuse capture_poll_interval_s
averaged_label_enabled:         # null → auto-true iff tracker_samples_per_command > 1
export_first_sample_label: true
export_averaged_sample_label:   # null → auto-true iff averaged_label_enabled
settle_time_s: 0.15
max_tracker_age_s: 0.15
capture_timeout_s: 1.0
capture_poll_interval_s: 0.02
tool_id: "0A"
require_robot_frame_tip: true
workspace_amplitude_cm: 1.0
envelope_utilization: 0.75
quasi_random: true
random_seed: 7
hysteresis_target_count: 8
hysteresis_cycle_count: 2
hysteresis_prior_family_count: 4
repeatability_block_count: 3
allow_lower_trust_runtime_tip: false
allow_lower_trust_pretension: false
allow_no_tracker_test_run: false
run_trust_mode: "thesis_trusted"  # thesis_trusted | servo_only
export_legacy_dat: true
run_label: "upgraded_robot_modeling"
dataset_tag: "baseline_v1"
post_write_settle_s: 0.0
telemetry_retry_count: 2
telemetry_retry_delay_s: 0.07
allow_recovered_packet_errors: true
max_recovered_packet_errors_per_run:
max_current_warning_ma: 800
current_warning_ma: 800
# Raised 2026-05-18 from 850 → 1200 mA for 12-hour thesis runs. Below 1200 mA,
# transient spikes are warned + drop the sample + continue (transient_spike_policy
# below). A SINGLE servo sustaining ≥ 1200 mA for `sustained_jam_cycles` cycles
# still stops the run safely (sustained_jam_policy: stop_safely) — that is the
# only current-driven termination path. Headroom stays well below the
# XC330-M288-T approximate 1.8 A stall current.
transient_current_spike_ma: 1200
sustained_jam_current_ma: 1200
sustained_jam_cycles: 3
transient_spike_policy: warn_drop_sample_continue
sustained_jam_policy: stop_safely
current_spike_resync_enabled: true
current_spike_cooldown_s: 0.25
current_spike_return_to_previous_safe_goal: false
current_spike_max_events_per_servo: 6
command_transition_ramp_enabled: false
max_delta_cm_per_ramp_step:
ramp_step_settle_s: 0.05
ramp_include_telemetry_checks: true
ramp_log_intermediate_telemetry: false
profile_velocity_ticks_per_s:
profile_acceleration:

# Long unattended runs: recoverable post-motion packet errors (drop sample + resync), chunking, health.
long_run_recovery_enabled: true
transport_burst_recovery_enabled: true
on_unrecovered_post_motion_telemetry: drop_sample_and_resync  # vs fail_run
max_consecutive_packet_failures: 3
max_consecutive_transport_bursts: 3
max_total_packet_failures: 100
max_total_dropped_samples_fraction: 0.05
transport_burst_cooldown_s: 0.35
transport_burst_resync_attempts: 5
transport_burst_resync_delay_s: 0.1
retry_same_command_after_resync: true
resync_read_attempts: 3
resync_delay_s: 0.05
return_to_neutral_on_resync_failure: false
chunk_flush_every_n_commands: 1000
resume_from_command_index: 0
long_run_health_write_interval_samples: 100
goal_write_retry_attempts: 3
allow_partial_dataset_after_telemetry_drops: false
