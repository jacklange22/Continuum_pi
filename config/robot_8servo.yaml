mode: "single_segment"
selected_servo_id: 1
spool_diameter_cm: 2.0
ticks_per_revolution: 4096
servo_ids: [1, 2, 3, 4, 5, 6, 7, 8]
tendon_to_servo: [1, 2, 3, 4, 5, 6, 7, 8]
active_segment: "segment_a"
segments:
  segment_a:
    label: "Spine 1"
    segment_label: "Segment A"
    segment_role: "proximal"
    segment_order_index: 0
    servo_ids: [1, 2, 3, 4]
    pairs:
      axis_a: [1, 3]
      axis_b: [2, 4]
  segment_b:
    label: "Spine 2"
    segment_label: "Segment B"
    segment_role: "distal"
    segment_order_index: 1
    servo_ids: [5, 6, 7, 8]
    pairs:
      axis_a: [5, 7]
      axis_b: [6, 8]
tightening_rotation_by_servo:
  1: "cw"
  2: "cw"
  3: "cw"
  4: "cw"
  5: "cw"
  6: "cw"
  7: "cw"
  8: "cw"
# Physical assembly: which fixed segment sits at the bottom (proximal) of the
# stacked two-segment rig and which at the top (distal). The fixed segments
# `segment_a` ([1,2,3,4]) and `segment_b` ([5,6,7,8]) are hardware identities
# and do not move. Their *role* (bottom vs top) is selectable here so the
# operator can flip the physical stack without renaming servos. The two-segment
# kinematics convention is T_distal = T_bottom(q_bottom) * T_top(q_top); no
# two-segment control is implemented yet.
physical_assembly:
  bottom_segment: "segment_a"
  top_segment: "segment_b"
  lower_tick_means_tension: true
  notes: ""
