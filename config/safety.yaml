# Stored as later application-bounds metadata. The one-servo bench bringup
# tool uses raw XC330 counts 0..4095 as its active jog range.
position_min_offset_ticks: -600
position_max_offset_ticks: 600
# Long-run thesis-experiment headroom: raised 2026-05-18 from 850 → 1200 mA so
# that transient peaks on a healthy rig (typical post-motion: 700-900 mA,
# longest observed-run max: 834 mA) don't trip the hard limit and abort a
# 12-hour run. Stays well below XC330-M288-T approximate 1.8 A stall current.
# Tendon force is still bounded by the conservative goal-current modes; this
# is the catch-everything-else absolute software limit.
max_current_ma: 1200
servo_model: XC330-M288-T
# Hard current safety is intentionally separate from pretension tuning
# thresholds. DYNAMIXEL present current is a servo-reported input-current
# estimate, not calibrated tendon force. XC330-M288-T documentation lists
# recommended 5 V operation, approximate 1.8 A stall current at 5 V, and a
# Current Limit(38) control-table item/range that should be respected where
# configured by firmware. This software limit stays conservative and checks
# absolute current magnitude so negative reported current cannot bypass safety.
# Kept slightly above max_current_ma so the absolute-magnitude check is the
# active gate, not this redundant ceiling.
servo_reported_current_hard_limit_ma: 1250
servo_reported_current_warning_ma: 650
current_safety_basis: "XC330-M288-T servo-reported input-current estimate; absolute magnitude limit below approximate 5 V stall current; Current Limit(38) should also be respected where configured/read."
# Brief wait between writing goal positions and reading post-motion telemetry
# for the single-segment experiment motion path. The XC330-M288-T runs at
# ~234 rpm by default (~32 ms per 522-tick move), so sampling current the
# instant the goal write returns catches the servo mid-motion when its driver
# is still actively pushing — that produces 700-900 mA transient readings that
# trip the post-move hard limit even though the rig is healthy at rest. A small
# settle (~75 ms) lets motion finish and current decay before the safety check.
# Set to 0.0 to restore the original behavior; the chase-tight-loop path always
# skips this wait.
simple_experiment_motion_settle_s: 2.0
default_pretension_current_threshold_ma: 30
pretension_current_balance_tolerance_ma: 15
fine_jog_step_ticks: 12
coarse_jog_step_ticks: 125
software_position_margin_ticks: 64
# Keep the stale-telemetry gate honest for bring-up. If this trips on the Pi,
# fix read cadence/latency before relaxing the threshold.
telemetry_stale_after_s: 0.25
# Hardware-day tendon policy: normal GUI close/reload/disconnect preserves
# current servo torque state unless an operator explicitly disables torque.
torque_off_on_disconnect: false
# Raw XC330 0..4095 discontinuity guard. Commands near/crossing the raw wrap
# boundary are blocked until a safe neutral/startup state is recaptured.
wrap_risk_margin_ticks: 128
max_raw_jump_without_wrap_risk_ticks: 900
pretension_untensioned_reference_tick: 3500
pretension_start_mode: soft_release_to_zero_current  # soft_release_to_zero_current (default) | current_position | manual_startup_artifact | release_200_from_current | full_release_4095
pretension_step_ticks: 4
pretension_timeout_s: 30.0
pretension_settle_time_s: 0.08
pretension_baseline_sample_count: 8
pretension_current_filter_window: 5
# Trigger thresholds are scaled to the XC330-M288-T tendon-tension scale observed
# on the live rig: ~15 mA = light, ~30 mA = tight, ~50 mA = a lot. These are not
# tendon force, only servo-reported input current (a load proxy).
pretension_current_delta_threshold_ma: 20
pretension_absolute_trigger_current_ma: 30
pretension_hard_current_stop_ma: 850
# Tensioned position is around tick 2500 with the release reference at 3500
# (or 4095 in full-release mode). Travel budget must cover the full release-to-
# tensioned range plus headroom for one servo binding early.
pretension_max_travel_ticks: 1600
max_temperature_c: 70
min_input_voltage_mv: 4000
