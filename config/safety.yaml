# Stored as later application-bounds metadata. The one-servo bench bringup
# tool uses raw XC330 counts 0..4095 as its active jog range.
position_min_offset_ticks: -600
position_max_offset_ticks: 600
max_current_ma: 850
servo_model: XC330-M288-T
# Hard current safety is intentionally separate from pretension tuning
# thresholds. DYNAMIXEL present current is a servo-reported input-current
# estimate, not calibrated tendon force. XC330-M288-T documentation lists
# recommended 5 V operation, approximate 1.8 A stall current at 5 V, and a
# Current Limit(38) control-table item/range that should be respected where
# configured by firmware. This software limit stays conservative and checks
# absolute current magnitude so negative reported current cannot bypass safety.
servo_reported_current_hard_limit_ma: 850
servo_reported_current_warning_ma: 650
current_safety_basis: "XC330-M288-T servo-reported input-current estimate; absolute magnitude limit below approximate 5 V stall current; Current Limit(38) should also be respected where configured/read."
default_pretension_current_threshold_ma: 220
pretension_current_balance_tolerance_ma: 120
fine_jog_step_ticks: 5
coarse_jog_step_ticks: 25
software_position_margin_ticks: 64
# Keep the stale-telemetry gate honest for bring-up. If this trips on the Pi,
# fix read cadence/latency before relaxing the threshold.
telemetry_stale_after_s: 0.25
pretension_untensioned_reference_tick: 4095
pretension_start_mode: current_position  # current_position | manual_startup_artifact | release_200_from_current | full_release_4095
pretension_step_ticks: 2
pretension_timeout_s: 10.0
pretension_settle_time_s: 0.05
pretension_baseline_sample_count: 5
pretension_current_filter_window: 3
pretension_current_delta_threshold_ma: 60
pretension_absolute_trigger_current_ma: 220
pretension_hard_current_stop_ma: 850
pretension_max_travel_ticks: 320
max_temperature_c: 70
min_input_voltage_mv: 4000
