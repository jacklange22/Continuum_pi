    xyz_mm: [-35.0, 0.0, -5.0]
    enabled: true
  - id: L3
    display_label: "South Outer"
    xyz_mm: [0.0, -35.0, -5.0]
    enabled: true
  - id: L4
    display_label: "East Outer"
    xyz_mm: [35.0, 0.0, -5.0]
    enabled: true
  - id: L5
    display_label: "North Inner"
    xyz_mm: [0.0, 25.0, -5.0]
    enabled: true
  - id: L6
    display_label: "West Inner"
    xyz_mm: [-25.0, 0.0, -5.0]
