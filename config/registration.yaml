landmark_labels: [L1, L2, L3, L4, L5, L6, L7, L8, L9, L10, L11, L12]
captures_per_landmark: 20
# Thesis-grade registration uses all 12 candidate landmarks at k=20 samples
# each. Rationale: the registration_trial bench showed that the honest
# (non-cherry-picked) FRE bottoms out at full point count, and that k=20 is
# the smallest sample count where run-to-run FRE std drops below ~0.005 mm.
# Smaller subsets give lower fit-residual but worse target accuracy — the
# extra points constrain the rigid fit instead of letting it absorb noise.
# Operator captures repeated 0B pen-probe samples at each landmark, solves,
# reviews FRE, then saves.
capture_tool_id: "0B"
coil_tool_id: "0A"
# Leave the legacy asset paths unset so the runtime stays on the simple
# 4-point body-alignment path instead of the old 12-point asset workflow.
model_points_file: ""
tip_points_file: ""
T_sw_2_model_file: ""
T_sw_2_tip_file: ""
penprobe_file: "data/pivot_calibration/generated_penprobe_tip.csv"
quaternion_average_method: "sign_aligned_mean"
model_tre_reference_radius_mm: 5.0
tip_tre_reference_radius_mm: 3.0
# Separate advanced 0A runtime tip calibration, used for the live chain
# T_robot_tip = T_robot_aurora @ T_aurora_coil @ T_coil_tip.
# This is distinct from 0B pivot calibration and from base registration.
runtime_tip_truth_points_file: "tools/all_tip_registration_points_in_sw"
runtime_tip_T_sw_2_tip_file: "tools/T_sw_2_tip"
runtime_tip_captures_per_landmark: 3
runtime_tip_coil_sample_count: 50
runtime_tip_coil_sample_interval_s: 0.02
runtime_tip_max_hat_rmse_mm: 2.0
runtime_tip_setup_id: ""
two_segment_tracking_roles:
  registration_probe:
    tool_id: "0B"
    physical_meaning: "Pivot-calibrated registration/pen probe used for registration and pivot workflows."
    pose_kind: "calibrated_tip"
    required_for_two_segment_model_training: false
    required_for_control: false
    trust_level: "registration_workflow"
    source: "registration.yaml"
    max_age_s:
    enabled: true
  distal_tip:
    tool_id: "0A"
    physical_meaning: "Distal/top robot coil or calibrated physical distal tip used as the primary two-segment output label."
    pose_kind: "calibrated_tip"
    required_for_two_segment_model_training: true
    required_for_control: false
    trust_level: "runtime_tip_policy"
    source: "registration.yaml"
    max_age_s: 0.15
    enabled: true
  intermediate_segment:
    tool_id: ""
    physical_meaning: "Optional Segment A distal end / intermediate joint coil."
    pose_kind: "coil_origin"
    required_for_two_segment_model_training: false
    required_for_control: false
    trust_level: "optional"
    source: "registration.yaml"
    max_age_s: 0.15
    enabled: false
  debug_tool:
    tool_id: ""
    physical_meaning: "Optional tracked tool recorded for diagnostics only."
    pose_kind: "coil_origin"
    required_for_two_segment_model_training: false
    required_for_control: false
    trust_level: "debug_only"
    source: "registration.yaml"
    max_age_s:
    enabled: false
# Candidate landmarks derived from the protected SolidWorks registration model
# points under tools/12_model_registration_points_in_sw transformed by
# tools/T_sw_2_model into the robot/body frame. The operator still chooses the
# best four visible points at runtime.
candidate_landmarks:
  - id: L1
    display_label: "North Outer"
    xyz_mm: [0.0, 35.0, -5.0]
    enabled: true
  - id: L2
    display_label: "West Outer"
    xyz_mm: [-35.0, 0.0, -5.0]
    enabled: true
  - id: L3
    display_label: "South Outer"
    xyz_mm: [0.0, -35.0, -5.0]
    enabled: true
  - id: L4
    display_label: "East Outer"
    xyz_mm: [35.0, 0.0, -5.0]
    enabled: true
  - id: L5
    display_label: "North Inner"
    xyz_mm: [0.0, 25.0, -5.0]
    enabled: true
  - id: L6
    display_label: "West Inner"
    xyz_mm: [-25.0, 0.0, -5.0]
    enabled: true
  - id: L7
    display_label: "South Inner"
    xyz_mm: [0.0, -25.0, -5.0]
    enabled: true
  - id: L8
    display_label: "East Inner"
    xyz_mm: [25.0, 0.0, -5.0]
    enabled: true
  - id: L9
    display_label: "North-East Inner"
    xyz_mm: [10.0, 25.0, -5.0]
    enabled: true
  - id: L10
    display_label: "West-North Inner"
    xyz_mm: [-25.0, 10.0, -5.0]
    enabled: true
  - id: L11
    display_label: "South-West Inner"
    xyz_mm: [-10.0, -25.0, -5.0]
    enabled: true
  - id: L12
    display_label: "East-South Inner"
    xyz_mm: [25.0, -10.0, -5.0]
    enabled: true
# Optional RANSAC outlier rejection on the live registration solve. Off by
# default. When enabled, the solver iteratively samples 3-point candidate fits,
# scores each by how many landmarks agree within `ransac_inlier_threshold_mm`,
# refits on the largest consensus, and reports which landmarks were rejected.
# Use for thesis registrations where one bad capture (tracker glitch, hand
# slip, fixture flex) shouldn't poison the whole fit.
#   ransac_inlier_threshold_mm     : residual cutoff for "good" point (mm)
#   ransac_min_consensus_size      : floor on inlier count (null = max(4, N/2))
#   ransac_seed                    : set int for run-to-run reproducibility
ransac_outlier_rejection_enabled: false
ransac_inlier_threshold_mm: 1.0
ransac_min_consensus_size: null
ransac_max_iterations: 1000
ransac_seed: null
validation:
  max_fre_mm: 2.0
