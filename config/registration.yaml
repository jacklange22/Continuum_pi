landmark_labels: [L1, L2, L3, L4]
captures_per_landmark: 5
# Canonical GUI registration is a 4-point robot-body alignment workflow.
# The operator chooses the best four landmarks from this configured candidate set,
# captures repeated 0B pen-probe samples, solves, reviews FRE, then saves.
capture_tool_id: "0B"
coil_tool_id: "0A"
# Leave the legacy asset paths unset so the runtime stays on the simple
# 4-point body-alignment path instead of the old 12-point asset workflow.
model_points_file: ""
tip_points_file: ""
T_sw_2_model_file: ""
T_sw_2_tip_file: ""
penprobe_file: "data/pivot_calibration/generated_penprobe_tip.csv"
quaternion_average_method: "sign_aligned_mean"
model_tre_reference_radius_mm: 5.0
tip_tre_reference_radius_mm: 3.0
# Separate advanced 0A runtime tip calibration, used for the live chain
# T_robot_tip = T_robot_aurora @ T_aurora_coil @ T_coil_tip.
# This is distinct from 0B pivot calibration and from base registration.
runtime_tip_truth_points_file: "tools/all_tip_registration_points_in_sw"
runtime_tip_T_sw_2_tip_file: "tools/T_sw_2_tip"
runtime_tip_captures_per_landmark: 3
runtime_tip_coil_sample_count: 50
runtime_tip_coil_sample_interval_s: 0.02
runtime_tip_max_hat_rmse_mm: 2.0
runtime_tip_setup_id: ""
# Candidate landmarks derived from the protected SolidWorks registration model
# points under tools/12_model_registration_points_in_sw transformed by
# tools/T_sw_2_model into the robot/body frame. The operator still chooses the
# best four visible points at runtime.
candidate_landmarks:
  - id: L1
    display_label: "North Outer"
    xyz_mm: [0.0, 35.0, -5.0]
    enabled: true
  - id: L2
    display_label: "West Outer"
    xyz_mm: [-35.0, 0.0, -5.0]
    enabled: true
  - id: L3
    display_label: "South Outer"
    xyz_mm: [0.0, -35.0, -5.0]
    enabled: true
  - id: L4
    display_label: "East Outer"
    xyz_mm: [35.0, 0.0, -5.0]
    enabled: true
  - id: L5
    display_label: "North Inner"
    xyz_mm: [0.0, 25.0, -5.0]
    enabled: true
  - id: L6
    display_label: "West Inner"
    xyz_mm: [-25.0, 0.0, -5.0]
    enabled: true
  - id: L7
    display_label: "South Inner"
    xyz_mm: [0.0, -25.0, -5.0]
    enabled: true
  - id: L8
    display_label: "East Inner"
    xyz_mm: [25.0, 0.0, -5.0]
    enabled: true
  - id: L9
    display_label: "North-East Inner"
    xyz_mm: [10.0, 25.0, -5.0]
    enabled: true
  - id: L10
    display_label: "West-North Inner"
    xyz_mm: [-25.0, 10.0, -5.0]
    enabled: true
  - id: L11
    display_label: "South-West Inner"
    xyz_mm: [-10.0, -25.0, -5.0]
    enabled: true
  - id: L12
    display_label: "East-South Inner"
    xyz_mm: [25.0, -10.0, -5.0]
    enabled: true
validation:
  max_fre_mm: 2.0
