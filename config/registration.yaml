landmark_labels: [L1, L2, L3, L4, L5, L6, L7, L8, L9, L10, L11, L12]
captures_per_landmark: 20
# Thesis-grade registration uses all 12 candidate landmarks at k=20 samples
# each. Rationale: the registration_trial bench showed that the honest
# (non-cherry-picked) FRE bottoms out at full point count, and that k=20 is
# the smallest sample count where run-to-run FRE std drops below ~0.005 mm.
# Smaller subsets give lower fit-residual but worse target accuracy — the
# extra points constrain the rigid fit instead of letting it absorb noise.
# Operator captures repeated 0B pen-probe samples at each landmark, solves,
# reviews FRE, then saves.
capture_tool_id: "0B"
coil_tool_id: "0A"
# Leave the legacy asset paths unset so the runtime stays on the simple
# 4-point body-alignment path instead of the old 12-point asset workflow.
model_points_file: ""
tip_points_file: ""
T_sw_2_model_file: ""
T_sw_2_tip_file: ""
penprobe_file: "data/pivot_calibration/generated_penprobe_tip.csv"
quaternion_average_method: "sign_aligned_mean"
model_tre_reference_radius_mm: 5.0
tip_tre_reference_radius_mm: 3.0
# Separate advanced 0A runtime tip calibration, used for the live chain
# T_robot_tip = T_robot_aurora @ T_aurora_coil @ T_coil_tip.
# This is distinct from 0B pivot calibration and from base registration.
runtime_tip_truth_points_file: "tools/all_tip_registration_points_in_sw"
runtime_tip_T_sw_2_tip_file: "tools/T_sw_2_tip"
runtime_tip_captures_per_landmark: 3
runtime_tip_coil_sample_count: 50
runtime_tip_coil_sample_interval_s: 0.02
runtime_tip_max_hat_rmse_mm: 2.0
runtime_tip_setup_id: ""
# Two-segment tracking roles. Bench default (2026-05-19): single coil only —
# 0B is the registration probe, 0A is the distal/top coil and is the sole
# pose label. Intermediate (0C) is wired in below but `enabled: false`; flip
# `enabled: true` and set `tool_id: "0C"` (or whichever Aurora port the
# second coil lands on) when a second coil becomes available. Auto label
# mode will then upgrade trained datasets to `two_coil_xyz` automatically
# without any code change — the policy gate is reliability of the
# intermediate coil during collection, not flag flipping.
two_segment_tracking_roles:
  registration_probe:
    tool_id: "0B"
    physical_meaning: "Pivot-calibrated registration/pen probe used for registration and pivot workflows."
    pose_kind: "calibrated_tip"
    required_for_two_segment_model_training: false
    required_for_control: false
    trust_level: "registration_workflow"
    source: "registration.yaml"
    max_age_s:
    enabled: true
  distal_tip:
    tool_id: "0A"
    physical_meaning: "Distal/top robot coil. Sole pose label for single-coil bench setup; primary metric for two-segment repeatability."
    pose_kind: "calibrated_tip"
    required_for_two_segment_model_training: true
    required_for_control: false
    trust_level: "runtime_tip_policy"
    source: "registration.yaml"
    max_age_s: 0.15
    enabled: true
  intermediate_segment:
    # SECOND COIL PLACEHOLDER. Leave `enabled: false` until a second Aurora
    # coil is wired into the rig and registered; then set `tool_id: "0C"`
    # (or actual port) and `enabled: true`. Distal-only datasets remain
    # valid for ANN training while this stays disabled — `label_mode=auto`
    # will pick `distal_xyz` and the run reports `distal_only: true`.
    tool_id: ""
    physical_meaning: "Optional intermediate (bottom-segment top / inter-segment) coil. Disabled while only one coil is wired."
    pose_kind: "coil_origin"
    required_for_two_segment_model_training: false
    required_for_control: false
    trust_level: "optional"
    source: "registration.yaml"
    max_age_s: 0.15
    enabled: false
  debug_tool:
    tool_id: ""
    physical_meaning: "Optional tracked tool recorded for diagnostics only."
    pose_kind: "coil_origin"
    required_for_two_segment_model_training: false
    required_for_control: false
    trust_level: "debug_only"
    source: "registration.yaml"
    max_age_s:
    enabled: false
