# Copy this file to config/system.local.yaml and edit for each machine.
# system.local.yaml is intentionally ignored by git so each computer can keep
# its own serial ports and local bridge path without creating git noise.

# Pi bring-up defaults for the 4-servo OpenRB / XC330 path.
# Switch back to `robot_1servo.yaml` only when doing loose single-servo bench work.
robot_config: "robot_4servo.yaml"
aurora_port: "/dev/ttyUSB0"
# On the Pi this is typically `/dev/ttyACM0` for OpenRB-150.
# On macOS this is typically a `cu.usbmodem*` or `tty.usbmodem*` device.
openrb_port: "/dev/ttyACM0"
tracker_backend: "ndi"
# Keep legacy bridge fallback off unless you are explicitly validating it.
tracker_fallback_backend:
tracker_fallback_enabled: false
tracker_type: "aurora"
baudrate: 57600
mock_mode: false
# This drives the GUI refresh timer. For Pi bring-up, 20 Hz is a practical
# default for fresher selected-servo status without pretending telemetry is
# newer than it really is.
poll_rate_hz: 20
visualization_mode: "auto"
visualization_safe_effects: true
robot_overrides:
  servo_ids: [1, 2, 3, 4]
  tendon_to_servo: [1, 2, 3, 4]
  # Stored as wrap metadata for later expansion. Bring-up jog uses raw XC330
  # counts directly: tighten lowers counts, loosen raises counts.
  tightening_rotation_by_servo:
    1: "cw"
    2: "cw"
    3: "cw"
    4: "cw"
safety_overrides:
  fine_jog_step_ticks: 5
  coarse_jog_step_ticks: 25
  # These offset values are stored as later application-bounds metadata.
  # The one-servo bench bringup tool actively clamps jogs only to raw 0..4095.
  position_min_offset_ticks: -600
  position_max_offset_ticks: 600
  software_position_margin_ticks: 64
  # Keep this aligned with measured live refresh timing on the Pi. Do not raise
  # it just to hide stale-telemetry problems during bring-up.
  telemetry_stale_after_s: 0.25
  min_input_voltage_mv: 4000
  default_pretension_current_threshold_ma: 220
  pretension_untensioned_reference_tick: 4095
  pretension_baseline_sample_count: 5
  pretension_current_filter_window: 3
  pretension_current_delta_threshold_ma: 60
  pretension_absolute_trigger_current_ma: 220
  pretension_hard_current_stop_ma: 850
  pretension_max_travel_ticks: 320
read_timeout_s: 0.05
frame_timeout_s: 0.5
reconnect_delay_s: 1.0
tracker_freshness_timeout_s: 0.5
tracker_ports_to_probe: []
tracker_settings_overrides: {}
tracker_tool_id_aliases:
  "10": "0A"
  "11": "0B"
# Retained only for the retired legacy bridge compatibility path.
tracker_socket_path: "/tmp/tracker_bridge.sock"
tracker_bridge_executable: "bin/tracker_bridge"
tracker_poll_ms: 20
# Tracker MVP bench target for current Aurora validation.
tracker_min_effective_fps: 15.0
tracker_max_stale_interval_s: 0.25
tracker_max_consecutive_missing_frames: 20
tracker_require_valid_transforms: true
packet_capture_dir: ""
neutral_setpoints_path: "config/neutral_setpoints.json"
latest_registration_path: "data/registrations/latest_registration.json"
latest_runtime_tip_calibration_path: "data/runtime_tip_calibration/latest_runtime_tip_calibration.json"
openrb_settings:
  connect_timeout_s: 0.5
  port_settle_time_s: 0.15
  require_usb_to_dynamixel_firmware: true
  require_external_power_for_motion: true
dynamixel_settings:
  protocol_version: 2.0
  # Retained as low-level metadata for the bus seam. The one-servo MVP uses the
  # raw-position convention directly: tighten lowers counts, loosen raises counts.
  positive_tick_rotation: "ccw"
  # Coordinated 4-servo single-segment motion prefers Current-based Position
  # Control with explicit profile/current defaults.
  expected_operating_mode: 3
  allowed_operating_modes: [3]
  require_current_for_motion: true
  require_voltage_for_motion: true
  require_temperature_for_motion: true
  require_fresh_telemetry_for_motion: true
  default_profile_velocity: null
  default_profile_acceleration: null
  single_segment_auto_configure_motion_defaults: true
  single_segment_preferred_operating_mode: 5
  single_segment_allowed_operating_modes: [3, 5]
  single_segment_default_goal_current_ma: 850
  single_segment_default_profile_velocity: 80
  single_segment_default_profile_acceleration: 20
  auto_torque_enable_on_write: true
  torque_disable_for_eeprom_write: true
  discovery_min_id: 1
  discovery_max_id: 20
  voltage_scale_mv_per_unit: 100.0
  current_scale_ma_per_unit: 1.0
  control_table:
    model_number: 0
    firmware_version: 6
    servo_id: 7
    operating_mode: 11
    current_limit: 38
    max_position_limit: 48
    min_position_limit: 52
    torque_enable: 64
    hardware_error_status: 70
    goal_current: 102
    bus_watchdog: 98
    profile_acceleration: 108
    profile_velocity: 112
    goal_position: 116
    present_current: 126
    present_position: 132
    present_input_voltage: 144
    present_temperature: 146
