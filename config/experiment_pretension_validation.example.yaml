mode: single_segment_staged  # single_servo_trace | single_segment_characterization | single_segment_staged
staged_strategy: conservative_startup  # conservative_startup | characterization; legacy is developer-only
allow_legacy_staged_strategy: false
servo_id: 1
servo_ids: []  # empty uses the active segment from the robot config
repeat_runs: 5  # 5 runs gives a usable repeatability std without taking forever
allow_current_only_when_tracker_missing: false
allow_no_tracker_test_run: false
run_trust_mode: thesis_trusted  # thesis_trusted | current_only
enable_tip_centering: true
tip_center_tolerance_mm: 1.0
tip_center_max_iterations: 16
tip_center_step_ticks: 8
tip_center_x_sign: 1
tip_center_y_sign: 1
tip_target_xy_mm: [0.0, 0.0]
max_tip_displacement_mm: 50.0
tip_divergence_stop_mm: 2.0
equalization_step_ticks: 4
equalization_max_iterations: 24
conservative_step_ticks: 8
conservative_max_iterations: 24
# Cumulative travel budget for BOTH the engagement scan and the conservative
# tip-centering trim phase (see _run_symmetric_paired_takeup). From a
# pretension_start_mode of full_release_4095, the engagement scan must walk
# every servo from ~tick 4094 back to its engagement tick (typically
# ~1900-2700), which is ~1500-2200 ticks of inward travel per servo. The trim
# phase then adds a few hundred ticks on top. 2500 gives a comfortable margin
# on full-release starts; a too-small value (1000 or below) causes the engagement
# scan to bail out with travel_budget_exhausted_during_engagement_scan before
# the tendons ever engage.
conservative_max_cumulative_travel_ticks: 2500
# Pretension workflow thresholds use servo-reported current estimates only as a
# load proxy. They are not calibrated tendon force and are separate from hard
# current safety limits in config/safety.yaml.
coarse_slack_step_ticks: 50
# Soft release runs OUTWARD (toward higher tick / slack). step * iterations sets
# the total travel; iterations = ceil(max_travel / step). Old defaults had
# step=50 max_travel=40 which yielded a single 50-tick release — far too short
# to reach genuine slack from a tensioned position. The new pair gives ~1500
# ticks of release travel which is enough to fully unload from any state.
soft_release_step_ticks: 50
soft_release_max_travel_ticks: 1500
soft_release_current_target_ma: 8.0

# --- Engagement-scan take-up (operator-spec'd 2026-05-18) -----------------
# The take-up phase runs in three steps:
#   1. Engagement scan: every iteration, step every still-unengaged servo
#      inward by engagement_scan_step_ticks. A servo is ENGAGED the moment
#      its filtered current rises above its baseline by
#      engagement_rise_threshold_ma. Record the engagement tick.
#   2. Back-off: command each engaged servo back to
#      engagement_tick + engagement_back_off_ticks. A small slack margin so
#      step 3 has room to add tension without immediately overshooting.
#   3. Fine take-up: step inward in conservative_step_ticks until every
#      servo's load proxy reaches takeup_target_load_proxy_ma.
#
# Operator's scale (2026-05-18): 15 mA = light, 30 mA = tight, 50 mA = a lot.
# rise_threshold = 5 sits above the typical 3-4 mA noise floor and well below
# "light" so engagement is detected on the very first tick of real tension.
engagement_scan_step_ticks: 50
engagement_rise_threshold_ma: 5.0
engagement_back_off_ticks: 50
# Operator's tendon-tension scale (from the live rig): 15 mA = light, 30 mA =
# tight, 50 mA = a lot. The take-up loop keeps stepping inward until every
# servo's current passes through the LOWER band edge (light), then transitions
# to the trim phase if any servo overshoots into the UPPER band edge.
takeup_target_load_proxy_ma: 20.0
high_load_proxy_ma: 40.0
takeup_max_iterations: 64
staged_packet_retry_budget: 3
characterization_step_ticks: 2
characterization_pair_cycles: 1
current_characterization_sample_count: 30  # more samples = tighter noise floor
current_noise_multiplier: 3.0
min_meaningful_current_delta_ma: 2.0
# Hard cap on the noise-derived ``max_useful_current_delta_ma`` reported by the
# characterization phase. Without this cap, a noisy baseline (e.g. PID hunting
# at the raw-tick wrap edge) can produce ``useful_delta`` values of 50-70 mA
# which then propagate into the load-balance tolerance and silently widen the
# entire control loop. 15 mA aligns with operator's "light" tendon-tension
# reference and keeps the loop responsive. Set to 0 to disable the cap.
max_useful_current_delta_cap_ma: 15.0
# After a ``full_release_4095`` start the servos sit at the safe-max raw tick
# (~3200-4094) which is at or near the position-wrap boundary. The PID hunts
# against the spool/tendon endpoint resistance there and emits a very noisy
# current signal — run 20260519_200616_pretension_validation measured 70 mA
# peak-to-peak from this. We step every servo inward by this many ticks
# BEFORE sampling baseline current so characterization happens at a stable,
# slack-but-off-edge position. 0 disables the off-edge step.
baseline_offset_from_full_release_ticks: 200
load_balance_tolerance_ma: 8.0
pair_balance_tolerance_ma: 8.0
settle_verify_time_s: 0.4
accept_max_load_balance_error_ma: 15.0
accept_max_pair_balance_error_ma: 15.0
accept_max_final_tip_xy_offset_mm: 2.0
max_runtime_s: 120.0

# Leave individual fields unset to use the current live pretension defaults
# from the active servo safety/runtime configuration.
include_tracker_displacement: true
tracker_tool_id: "0A"
move_to_reference: true
# Default start mode (2026-05-19): walk each servo OUTWARD (higher tick =
# looser on this rig) until its current sits below
# ``release_current_abs_target_ma`` for ``release_current_stable_samples``
# consecutive samples. This proves each tendon is genuinely slack rather than
# trusting the position-wrap endpoint. The legacy ``full_release_4095`` mode
# is kept for backward compatibility but is no longer recommended for the
# normal workflow because it puts the servos at the raw-tick wrap edge.
pretension_start_mode: soft_release_to_zero_current  # soft_release_to_zero_current (default) | current_position | manual_startup_artifact | release_200_from_current | full_release_4095
# --- soft_release_to_zero_current knobs ----------------------------------
release_current_abs_target_ma: 5.0      # |current_ma| below this counts as slack (operator: 15 mA = light)
release_current_stable_samples: 3       # need this many consecutive samples below threshold
release_max_travel_ticks: 1500          # hard cap on outward travel per servo
release_step_ticks: 40                  # outward step size per iteration
release_settle_s: 0.15                  # sleep between release steps so current can settle
# Low-current plateau fallback for first-try robustness. Real servos often
# plateau at 6-10 mA because of holding current / friction rather than dropping
# all the way to <= release_current_abs_target_ma. The fallback declares a
# servo released when |current_ma| stays below release_plateau_max_current_ma
# AND the spread across the last release_plateau_window_samples readings is
# below release_plateau_delta_ma — i.e. more outward motion isn't buying any
# meaningful drop. Set release_plateau_max_current_ma to 0 to disable.
release_plateau_max_current_ma: 10.0    # upper bound on |current_ma| for the plateau fallback
release_plateau_delta_ma: 2.0           # max allowed spread within the plateau window
release_plateau_window_samples: 4       # how many consecutive samples must plateau

# --- Tip-centering variant (default + advanced) --------------------------
# Default: ``paired_then_tip``. This is the simple, safe operator path. The
# other variants are kept available but are advanced / diagnostic only and
# should not be the typical operator choice:
#   - ``current_only``: stop after take-up, no tip feedback (no tracker).
#   - ``jacobian_learned_tip``: experimental Jacobian probe; falls back to
#     paired_then_tip when probe response is below the observability floor.
tip_centering_variant: paired_then_tip
# Require_improvement: when True, paired tip-centering steps that worsen tip
# XY error (or significantly worsen load balance) are stopped rather than
# chased. Keeps the loop conservative for first-try reliability.
tip_center_require_improvement: true
# Advanced (jacobian_learned_tip only). Ignored when the default variant is
# in use, but kept for backward-compat config payloads.
jacobian_probe_step_ticks: 30
jacobian_min_observable_tip_delta_mm: 0.20
jacobian_step_gain: 0.8
jacobian_max_pair_step_ticks: 25

# --- Phase 2 manual-baseline comparison -----------------------------------
# When non-zero, the experiment captures K manual baseline records BEFORE the
# algorithm runs (operator hand-tensions between captures). If a sidecar JSON
# already exists (typically written from the Servos tab "Record Manual
# Baseline" button), the experiment uses that file via
# manual_baseline_record_path and skips the inline capture phase.
manual_baseline_capture_count: 0
manual_baseline_pause_s: 15.0
manual_baseline_record_path: ""  # path relative to project root; empty = unused

untensioned_reference_tick:
step_ticks:
settle_time_s:
baseline_sample_count:
current_filter_window:
current_delta_threshold_ma:
absolute_trigger_current_ma:
hard_current_stop_ma:
max_travel_ticks:
timeout_s:
