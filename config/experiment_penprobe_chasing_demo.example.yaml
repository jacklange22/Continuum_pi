# Penprobe chasing demo (single-segment 0A coil chases live 0B XY target).
# Defaults below are conservative. Uncomment / copy alternate blocks only when
# the spine and tendon routing are confirmed clear for larger motion.
#
# --- Conservative lab tuning (recommended first) ---
# max_tick_step_per_cycle: 25
# max_tick_delta_from_startup: 250
# proportional_gain_ticks_per_mm: 8
#
# --- Larger visible demo (optional; not the default) ---
# max_tick_step_per_cycle: 50   # or up to 100 in GUI
# max_tick_delta_from_startup: 600
# hard_max_tick_delta_from_startup: 800   # YAML hard cap; GUI spin max is 800
# proportional_gain_ticks_per_mm: 15     # typical range 15–30 for demos

loop_period_s: 0.04
max_duration_s: 30.0
max_iterations: 750
max_tick_delta_from_startup: 250
hard_max_tick_delta_from_startup: 800
max_tick_step_per_cycle: 25
max_step_ticks: 25
max_target_radius_mm: 45.0
target_deadband_mm: 1.0
xy_deadband_mm: 1.0
proportional_gain_ticks_per_mm: 8.0
displacement_gain_cm_per_mm: 0.002
stale_tracker_timeout_s: 0.2
max_servo_write_hz: 25.0
telemetry_health_hz: 3.0
max_consecutive_telemetry_health_failures: 2
saturation_stop_cycles: 40
x_axis_sign: 1
y_axis_sign: 1
flip_x: false
flip_y: false
mapping_mode: paired_xy_proportional
legacy_polynomial_workspace: {}
