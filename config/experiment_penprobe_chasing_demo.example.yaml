# Penprobe chasing demo (single-segment 0A coil origin chases live 0B tool-origin XY in robot frame).
# Default mapping is aggressive_tick_demo (direct goal ticks; no paired XY L2 vector cap).
# use_calibrated_runtime_tip defaults false → runtime tip coil_as_tip for demo; summary treats
# invalid transform samples as non-fatal unless use_calibrated_runtime_tip is true.
#
# --- Conservative paired mapping (legacy envelope) ---
# mapping_mode: paired_xy_proportional
#
# --- Larger visible aggressive demo ---
# max_tick_step_per_cycle: 50   # or up to 100 in GUI
# max_tick_delta_from_startup: 600
# hard_max_tick_delta_from_startup: 800   # YAML hard cap; GUI spin max is 800
# proportional_gain_ticks_per_mm: 15     # typical range 15–30 for demos

loop_period_s: 0.04
max_duration_s: 30.0
max_iterations: 750
max_tick_delta_from_startup: 250
hard_max_tick_delta_from_startup: 800
max_tick_step_per_cycle: 25
max_step_ticks: 25
max_target_radius_mm: 45.0
target_deadband_mm: 1.0
xy_deadband_mm: 1.0
proportional_gain_ticks_per_mm: 8.0
displacement_gain_cm_per_mm: 0.002
stale_tracker_timeout_s: 0.2
max_servo_write_hz: 25.0
telemetry_health_hz: 3.0
max_consecutive_telemetry_health_failures: 2
saturation_stop_cycles: 40
x_axis_sign: 1
y_axis_sign: 1
flip_x: false
flip_y: false
mapping_mode: aggressive_tick_demo
aggressive_tick_demo: true
aggressive_current_limit_ma: 500
goal_write_retry_attempts: 2
use_calibrated_runtime_tip: false
legacy_polynomial_workspace: {}
