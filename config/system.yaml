robot_config: "robot_4servo.yaml"
aurora_port: ""
# On the Pi, OpenRB-150 commonly appears here as `/dev/ttyACM0`.
openrb_port: ""
tracker_backend: "ndi"
# Leave bridge fallback disabled unless you are explicitly debugging the legacy
# compatibility path. The Python NDI backend is the active runtime path.
tracker_fallback_backend:
tracker_fallback_enabled: false
tracker_type: "aurora"
# The current OpenRB / XC330 bring-up path has been confirmed at 57600.
# Keep machine-specific overrides in system.local.yaml when the local bench setup differs.
baudrate: 57600
mock_mode: true
visualization_mode: "auto"
visualization_safe_effects: true
read_timeout_s: 0.05
frame_timeout_s: 0.5
reconnect_delay_s: 1.0
tracker_freshness_timeout_s: 0.5
tracker_ports_to_probe: []
tracker_settings_overrides: {}
# Live Aurora handles observed on the Pi for the standard coil/probe pair.
# This preserves the raw ids for diagnostics while mapping them into the app's
# runtime roles.
tracker_tool_id_aliases:
  "10": "0A"
  "11": "0B"
# Retained only for the retired legacy bridge compatibility path.
tracker_socket_path: "/tmp/tracker_bridge.sock"
tracker_bridge_executable: "bin/tracker_bridge"
tracker_poll_ms: 20
# Tracker MVP bench target for the current Aurora bring-up pass.
# Raise this back to 20.0 once the live Pi path is consistently meeting it.
tracker_min_effective_fps: 15.0
tracker_max_stale_interval_s: 0.25
tracker_max_consecutive_missing_frames: 20
tracker_require_valid_transforms: true
# Keep the GUI refresh loop high enough that servo freshness is governed mainly
# by real serial latency, not by an artificially slow UI timer.
poll_rate_hz: 20
# The GUI refresh timer is not a substitute for honest servo freshness checks;
# stale telemetry is still blocked using `telemetry_stale_after_s`.
packet_capture_dir: ""
neutral_setpoints_path: "config/neutral_setpoints.json"
latest_registration_path: "data/registrations/latest_registration.json"
latest_runtime_tip_calibration_path: "data/runtime_tip_calibration/latest_runtime_tip_calibration.json"
safety_overrides:
  pretension_hard_current_stop_ma: 850
openrb_settings:
  connect_timeout_s: 0.5
  port_settle_time_s: 0.15
  require_usb_to_dynamixel_firmware: true
  require_external_power_for_motion: true
dynamixel_settings:
  protocol_version: 2.0
  # Retained as low-level metadata for the bus seam. The one-servo MVP uses the
  # raw-position convention directly: tighten lowers counts, loosen raises counts.
  positive_tick_rotation: "ccw"
  # Keep single-servo bring-up compatible with plain Position Control, but prefer
  # Current-based Position Control for coordinated 4-servo single-segment motion.
  expected_operating_mode: 3
  allowed_operating_modes: [3]
  require_current_for_motion: true
  require_voltage_for_motion: true
  require_temperature_for_motion: true
  require_fresh_telemetry_for_motion: true
  default_profile_velocity: null
  default_profile_acceleration: null
  single_segment_auto_configure_motion_defaults: true
  single_segment_preferred_operating_mode: 5
  single_segment_allowed_operating_modes: [3, 5]
  single_segment_default_goal_current_ma: 850
  single_segment_default_profile_velocity: 80
  single_segment_default_profile_acceleration: 20
  auto_torque_enable_on_write: true
  torque_disable_for_eeprom_write: true
  discovery_min_id: 1
  discovery_max_id: 20
  voltage_scale_mv_per_unit: 100.0
  current_scale_ma_per_unit: 1.0
  control_table:
    model_number: 0
    firmware_version: 6
    servo_id: 7
    operating_mode: 11
    current_limit: 38
    max_position_limit: 48
    min_position_limit: 52
    torque_enable: 64
    hardware_error_status: 70
    bus_watchdog: 98
    goal_current: 102
    profile_acceleration: 108
    profile_velocity: 112
    goal_position: 116
    present_current: 126
    present_position: 132
    present_input_voltage: 144
    present_temperature: 146
