robot_config: "robot_8servo.yaml"
aurora_port: ""
# On the Pi, OpenRB-150 commonly appears here as `/dev/ttyACM0`.
openrb_port: ""
tracker_backend: "ndi"
# Leave bridge fallback disabled unless you are explicitly debugging the legacy
# compatibility path. The Python NDI backend is the active runtime path.
# Thesis-trusted runs should keep fallback disabled so backend selection cannot
# silently switch at runtime.
tracker_fallback_backend:
tracker_fallback_enabled: false
tracker_type: "aurora"
# DYNAMIXEL bus baud.
# - 57600: legacy bring-up. Acceptable for single-segment work; the GUI
#   preflight will WARN when running 8-servo experiments at this baud.
# - 1000000: recommended for current eight-servo (dual_segment / parallel_single)
#   work. Reflash every servo with DYNAMIXEL Wizard to 1 000 000 baud BEFORE
#   raising this value here — the OpenRB will only see servos at their currently
#   flashed baud. Confirm with:
#     .venv/bin/python -m continuum_robot.diagnostics.servo_transport_diagnostic \
#         --servo-ids 1,2,3,4,5,6,7,8 --baud 1000000 --duration 10 --fields minimal
baudrate: 1000000
mock_mode: true
visualization_mode: "auto"
figure_output_quality: "production"
visualization_safe_effects: true
read_timeout_s: 0.05
frame_timeout_s: 0.5
reconnect_delay_s: 1.0
tracker_freshness_timeout_s: 0.5
tracker_ports_to_probe: []
tracker_settings_overrides: {}
# Live Aurora handles observed on the Pi for the standard coil/probe pair.
# This preserves the raw ids for diagnostics while mapping them into the app's
# runtime roles.
tracker_tool_id_aliases:
  "10": "0A"
  "11": "0B"
# Retained only for the retired legacy bridge compatibility path.
tracker_socket_path: "/tmp/tracker_bridge.sock"
tracker_bridge_executable: "bin/tracker_bridge"
tracker_poll_ms: 20
# Tracker MVP bench target for the current Aurora bring-up pass.
# Raise this back to 20.0 once the live Pi path is consistently meeting it.
tracker_min_effective_fps: 15.0
tracker_max_stale_interval_s: 0.25
tracker_max_consecutive_missing_frames: 20
tracker_require_valid_transforms: true
# Keep the GUI refresh loop high enough that servo freshness is governed mainly
# by real serial latency, not by an artificially slow UI timer.
poll_rate_hz: 20
# The GUI refresh timer is not a substitute for honest servo freshness checks;
# stale telemetry is still blocked using `telemetry_stale_after_s`.
packet_capture_dir: ""
# Active servo startup calibration singleton. Historical archives are written under
# `data/calibration/servo_calibration/`.
neutral_setpoints_path: "config/neutral_setpoints.json"
latest_registration_path: "data/registrations/latest_registration.json"
latest_runtime_tip_calibration_path: "data/runtime_tip_calibration/latest_runtime_tip_calibration.json"
safety_overrides:
  pretension_hard_current_stop_ma: 850
openrb_settings:
  connect_timeout_s: 0.5
  port_settle_time_s: 0.15
  # Keep onboard UARTs like `/dev/ttyAMA0` out of automatic fallback unless a
  # machine is explicitly wired to use them for OpenRB.
  allow_onboard_uart_fallback: false
  require_usb_to_dynamixel_firmware: true
  require_external_power_for_motion: true
dynamixel_settings:
  protocol_version: 2.0
  # Retained as low-level metadata for the bus seam. The one-servo MVP uses the
  # raw-position convention directly: tighten lowers counts, loosen raises counts.
  positive_tick_rotation: "ccw"
  # Keep single-servo bring-up compatible with plain Position Control.
  # Coordinated 4-servo experiment motion also uses Position Control by default.
  # Retain a separate current-aware profile only for explicit characterization /
  # tuning workflows that truly need it.
  expected_operating_mode: 3
  allowed_operating_modes: [3]
  require_current_for_motion: true
  require_voltage_for_motion: true
  require_temperature_for_motion: true
  require_fresh_telemetry_for_motion: true
  # Global slow-down for ALL goal-position writes (jog, pretension, etc.).
  # dxl_bus.write_goal_positions writes these registers before every
  # goal-position command, so setting them once here applies to every motion
  # path until power cycle. Keeping the rotor speed and (especially)
  # acceleration low reduces peak motor current spikes on take-up against
  # tendon load and makes manual jog feel deliberate rather than jumpy.
  #
  # Units (XC330-M288-T):
  #   profile_velocity:     N * 0.229 rev/min  (5 -> ~1.1 rev/min ≈ 6.9 deg/sec)
  #   profile_acceleration: N * 214.577 rev/min²  (1 -> ~3.6 rev/sec²)
  # Firmware default = 0 = unlimited; bumping these in adds a real ramp.
  # Lowered 2026-05-25 from 5/1 -> 3/1 for motor-babble collection:
  # command schedules now default to 3 s settle plus small transition ramps,
  # and the hardware profile should remain visibly deliberate during all-8
  # two-segment writes.
  # Prior step (2026-05-19): 15/4 -> 5/1 for the early two-segment bench-up:
  # operator wants the servos visibly slower while sign convention and
  # bottom/top assembly are still being confirmed. This is the safer-zone
  # default; bump back toward 15/4 once the bench is settled and the long
  # collect-pose runs need throughput.
  # Prior step (2026-05-18): 30/8 -> 15/4 to halve peak current spikes for
  # 12-hour unattended runs.
  default_profile_velocity: 3
  default_profile_acceleration: 1
  single_segment_auto_configure_motion_defaults: true
  single_segment_experiment_preferred_operating_mode: 3
  single_segment_experiment_allowed_operating_modes: [3]
  single_segment_experiment_default_goal_current_ma: null
  single_segment_experiment_default_profile_velocity: null
  single_segment_experiment_default_profile_acceleration: null
  single_segment_current_aware_preferred_operating_mode: 5
  single_segment_current_aware_allowed_operating_modes: [3, 5]
  single_segment_current_aware_default_goal_current_ma: 850
  single_segment_current_aware_default_profile_velocity: 80
  single_segment_current_aware_default_profile_acceleration: 20
  auto_torque_enable_on_write: true
  torque_disable_for_eeprom_write: true
  discovery_min_id: 1
  discovery_max_id: 20
  voltage_scale_mv_per_unit: 100.0
  current_scale_ma_per_unit: 1.0
  control_table:
    model_number: 0
    firmware_version: 6
    servo_id: 7
    operating_mode: 11
    current_limit: 38
    max_position_limit: 48
    min_position_limit: 52
    torque_enable: 64
    hardware_error_status: 70
    bus_watchdog: 98
    goal_current: 102
    profile_acceleration: 108
    profile_velocity: 112
    goal_position: 116
    present_current: 126
    present_position: 132
    present_input_voltage: 144
    present_temperature: 146
