[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum-robot"
version = "0.1.0"
description = "Raspberry Pi continuum robot control scaffold"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Continuum Lab" }]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "pyserial>=3.5",
  "dynamixel-sdk>=3.7",
  "scikit-surgerynditracker>=0.8",
  "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["continuum_robot*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
